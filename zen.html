<script>
'use strict';
/*__ZEN_PARSE_BEGIN__*/

/* ------------------------------------------------------------------
 * 名字归一化：跟 index.html 的 normPrivacyName 保持一致
 * ---------------------------------------------------------------- */
function normZenName(s) {
  return String(s || "")
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/\([^)]*\)/g, "")
    // 全角括号也必须剥：官方隐私条目写的是「Nemotron 3 Ultra Free（NVIDIA 免费端点）」，
    // 不剥的话键会变成 nemotron3ultrafreenvidia免费端点，匹配不上而整条规则被丢弃
    .replace(/（[^）]*）/g, "")
    .replace(/[_‐‑‒–—―]/g, "-")
    .replace(/\s+/g, "")
    .replace(/-/g, "")
    .toLowerCase();
}

/* 定位表格：给一个判定函数，返回表头行号（找不到 -1） */
function findZenTableHead(lines, match) {
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line.includes("|")) continue;
    const cells = line.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
    if (cells.every(c => c === "" || /^:?-{2,}:?$/.test(c))) continue;
    if (match(cells, line)) return i;
  }
  return -1;
}

/* 取表格头下面连续的数据行 */
function zenTableRows(lines, head) {
  const rows = [];
  for (let i = head + 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line.startsWith("|")) { if (rows.length) break; continue; }
    const cells = line.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
    if (cells.length < 2) continue;
    if (cells.every(c => c === "" || /^:?-{2,}:?$/.test(c))) continue;
    rows.push(cells);
  }
  return rows;
}

/* 1) 免费模型清单：定位「输入 + 输出、但没有每月限制」的定价表，
      只保留输入列写着 Free / 免费 的行 */
function parseZenPricingTable(md) {
  const lines = String(md || "").split(/\r?\n/);
  const head = findZenTableHead(lines, (cells, line) => {
    const hasIn = cells.some(c => /输入|\binput\b/i.test(c));
    const hasOut = cells.some(c => /输出|\boutput\b/i.test(c));
    const hasLimit = /每月限制|使用额度|monthly limit/i.test(line);
    return hasIn && hasOut && !hasLimit;
  });
  if (head === -1) return null;
  const rows = [];
  for (const cells of zenTableRows(lines, head)) {
    const name = String(cells[0] || "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").trim();
    if (!name) continue;
    if (/^(free|免费)$/i.test(String(cells[1] || "").trim())) rows.push({ name: name, key: normZenName(name) });
  }
  return rows.length ? rows : null;
}

/* 2) 模型 ID + 端点：定位含「模型 ID」的表（单元格带反引号，解析后剥掉） */
function parseZenModelIdTable(md) {
  const lines = String(md || "").split(/\r?\n/);
  const head = findZenTableHead(lines, cells => cells.some(c => /模型\s*ID|model\s*id/i.test(c)));
  if (head === -1) return null;
  const map = {};
  for (const cells of zenTableRows(lines, head)) {
    const name = String(cells[0] || "").trim();
    const id = String(cells[1] || "").replace(/`/g, "").trim();
    const endpoint = String(cells[2] || "").replace(/`/g, "").trim();
    const sdk = String(cells[3] || "").replace(/`/g, "").trim();
    if (!name || !id) continue;
    map[normZenName(name)] = { name: name, id: id, endpoint: endpoint, sdk: sdk };
  }
  return Object.keys(map).length ? map : null;
}

/* 3) 免费清单说明：定位「免费模型：/ Free models: / ### Free models」后面紧跟的一级列表 */
function parseZenFreeNotes(md) {
  const lines = String(md || "").split(/\r?\n/);
  let start = -1;
  for (let i = 0; i < lines.length; i++) {
    // 旧 zen.mdx 用「Free models:」带冒号；新 models.mdx 用「### Free models」标题
    if (/^\s*(免费模型|免费模型：|Free models)\s*[:：]/i.test(lines[i])) { start = i; break; }
    if (/^#{1,3}\s*Free models\s*$/i.test(lines[i].trim())) { start = i; break; }
  }
  if (start === -1) return null;
  const list = [];
  for (let i = start + 1; i < lines.length; i++) {
    const line = lines[i];
    const m = line.match(/^\s*-\s+(.+)$/);
    if (m) { list.push(m[1].trim()); continue; }
    if (line.trim() === "") continue;
    if (/^\s*#/.test(line) || /^\s*---/.test(line)) break;
  }
  return list.length ? list : null;
}

/* 3b) 把说明按模型名切开 → { key: 正文 } */
function splitZenFreeNotes(list, rows) {
  const out = {};
  if (!list) return out;
  for (const row of rows) {
    for (const raw of list) {
      const clean = String(raw || "")
        .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
        .replace(/\s+/g, " ")
        .trim();
      if (clean === row.name || clean.startsWith(row.name + " ")) {
        out[row.key] = clean.slice(row.name.length).trim();
        break;
      }
      const cn = clean.replace(/\s+/g, "");
      const rn = row.name.replace(/\s+/g, "");
      if (cn.startsWith(rn)) { out[row.key] = cn.slice(rn.length).trim(); break; }
    }
  }
  return out;
}

/* 4) 隐私例外清单：强制分流「模型级例外」与「厂商级通则」 */
function parseZenPrivacyList(md, freeKeys) {
  const lines = String(md || "").split(/\r?\n/);
  let head = -1;
  for (let i = 0; i < lines.length; i++) {
    if (/^##\s+(隐私|Privacy)\s*$/i.test(lines[i].trim())) { head = i; break; }
  }
  if (head === -1) return null;
  const modelRules = {};
  const vendorRules = {};
  const keys = (freeKeys || []).map(k => normZenName(k)).filter(Boolean);
  // 条目名可能带官方追加的括号说明，用「最长前缀命中」兜底，避免整条规则被丢弃
  function matchFreeKey(normName) {
    let best = null;
    for (const k of keys) {
      if (normName === k) return k;
      if (normName.startsWith(k) && (best === null || k.length > best.length)) best = k;
    }
    return best;
  }
  for (let i = head + 1; i < lines.length; i++) {
    const line = lines[i];
    if (/^##\s/.test(line)) break;
    const m = line.match(/^\s*-\s+([^:：]+)[:：]\s*([\s\S]*)$/);
    if (!m) continue;
    const name = m[1].trim();
    const text = m[2].replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").trim();
    if (!name || !text) continue;
    if (/\bAPIs?\b/i.test(name)) {
      const vendor = normZenName(name).replace(/apis?$/, "");
      vendorRules[vendor] = text;
    } else {
      const key = matchFreeKey(normZenName(name));
      if (key) modelRules[key] = text;
    }
  }
  return (Object.keys(modelRules).length || Object.keys(vendorRules).length)
    ? { modelRules: modelRules, vendorRules: vendorRules }
    : null;
}

/* 分档清单：前面是「隐私风险由低到高」——
   🟢 零留存不训练 → 🔵 不训练但按厂商政策留存 → 🟠 试用端点记录使用 → 🔴 免费期用于训练 → ⚪ 文档没写。
   2026-10-07 起表格与筛选条都按这个顺序排，零留存在最前。
   注意：这个顺序只影响「排序 / 图例展示」，不影响 classifyZenPrivacy() 的判定顺序（那是另一件事）。 */
var PRIVACY_ORDER = ["zero", "vendor", "trial", "train", "unknown"];

function classifyZenPrivacy(key, privacy) {
  const p = privacy || { modelRules: {}, vendorRules: {} };
  const modelRules = p.modelRules || {};
  const vendorRules = p.vendorRules || {};
  let text = modelRules[key] || "";
  if (!text) {
    for (const vendor in vendorRules) {
      if (vendor && key.indexOf(vendor) !== -1) { text = vendorRules[vendor]; break; }
    }
  }
  if (text) {
    if (/collect(ed)?\s+data\s+may\s+be\s+used\s+to\s+improve/i.test(text)
      || /收集的数据可能会被用于改进/.test(text)) return "train";
    if (/train\s+future\s+.*models/i.test(text)
      || /训练未来.*模型/.test(text)) return "train";
    if (/trial\s+use\s+only/i.test(text)
      || /仅供试用/.test(text)
      || /NVIDIA/i.test(text)) return "trial";
    return "vendor";
  }
  return "zero";
}

    footLiveOff: "Live availability check: disabled (local proxy not running). Start usage-proxy.py and this page will cross-check the official model API automatically.",
    footLiveDiff: "In API but not in docs: {list} (no privacy terms exist for these — use with care)",

    toastFailed: "Auto-update failed — keeping current data", toastFresh: "Free model list is up to date", toastUpdated: "Updated to the latest free model list"
  }
};

function t(key, vars) {
  const table = I18N[state.lang] || I18N.zh;
  let s = table[key] != null ? table[key] : (I18N.zh[key] != null ? I18N.zh[key] : key);
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}

function docUrl() {
  // 2026-10-13 官方文档迁移：新文档单文件全英文，无中英之分，统一指向新地址
  return "https://opencode.ai/v2/docs/console/models/";
}
function sourceLabel(key) {
  const zh = state.lang === "zh";
  const map = {
    github: zh ? "GitHub 源文件" : "GitHub raw",
    jsdelivr: zh ? "jsDelivr 镜像" : "jsDelivr mirror",
    ghproxy: zh ? "ghproxy 镜像" : "ghproxy mirror",
    ghproxy2: zh ? "gh-proxy 镜像" : "gh-proxy mirror",
    ghfast: zh ? "ghfast 镜像" : "ghfast mirror",
    cache: zh ? "本地缓存" : "Local cache",
    snapshot: zh ? "内置快照" : "Built-in snapshot"
  };
  return map[key] || key;
}

/* ---------- 数据组装 ---------- */
function buildRows(freeList, idMap, notes, rules, presetLevels) {
  const src = idMap || {};
  const preset = presetLevels || {};
  const out = [];
  for (const r of freeList) {
    const meta = src[r.key];
    out.push({
      key: r.key,
      name: r.name,
      modelId: meta ? meta.id : null,
      endpoint: meta ? meta.endpoint : null,
      sdk: meta ? meta.sdk : null,
      note: (notes && notes[r.key]) || "",
      // 快照带预设档位（人工核对过）就优先用它；实时解析才靠条款分档
      level: preset[r.key] || classifyZenPrivacy(r.key, rules)
    });
  }
  // 模型 ID 补不到（ID 表没解析出来）时，用快照兜底，避免整列空白
  const snapByKey = {};
  for (const s of ZEN_SNAPSHOT_ROWS) snapByKey[normZenName(s[0])] = s;
  for (const r of out) {
    if (!r.modelId) {
      const s = snapByKey[r.key];
      if (s) { r.modelId = s[1]; r.endpoint = r.endpoint || s[2]; r.snapshotFallback = true; }
    }
    if (!r.level) r.level = "zero";
  }
  return out;
}

function validateZenRows(rows) {
  return Array.isArray(rows)
    && rows.length >= 8
    && rows.every(r => r && typeof r.name === "string" && r.name.length > 0
      && PRIVACY_ORDER.indexOf(r.level) !== -1);
}

function zenDataKey(rows, rules) {
  const rk = rules
    ? Object.keys(rules.modelRules).sort().map(k => k + "=" + rules.modelRules[k].slice(0, 24)).join("|")
    : "";
  return JSON.stringify(rows.map(r => [r.name, r.modelId, r.endpoint, r.level])) + "#" + rk;
}

/* ---------- 校验：Zen 文档结构变化时宁可回落也不要渲染错数据 ---------- */
function validateZenSource(md) {
  const list = parseZenPricingTable(md);
  if (!list || list.length < 8) return null;
  const keys = list.map(r => r.key);
  const idMap = parseZenModelIdTable(md);
  const notes = splitZenFreeNotes(parseZenFreeNotes(md), list);
  const rules = parseZenPrivacyList(md, keys);
  const rows = buildRows(list, idMap, notes, rules);
  if (!validateZenRows(rows)) return null;
  return { rows: rows, rules: rules };
}

function snapshotRows() {
  const rules = snapshotRules();
  const list = ZEN_SNAPSHOT_ROWS.map(s => ({ name: s[0], key: normZenName(s[0]) }));
  const notes = {};
  const levels = {};
  for (const s of ZEN_SNAPSHOT_ROWS) { notes[normZenName(s[0])] = s[4]; levels[normZenName(s[0])] = s[3]; }
  return buildRows(list, null, notes, rules, levels);
}

/* ---------- 取数 ---------- */
function fetchText(url, ms) {
  return new Promise((resolve, reject) => {
    const ctl = new AbortController();
    const timer = setTimeout(() => { ctl.abort(); reject(new Error("timeout")); }, ms || 9000);
    fetch(url, { signal: ctl.signal, cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(txt => { clearTimeout(timer); resolve(txt); })
      .catch(e => { clearTimeout(timer); reject(e); });
  });
}

function saveZenCache(when) {
  try {
    localStorage.setItem(LS_ZEN_CACHE, JSON.stringify({
      v: 1, fetchedAt: when, lang: state.lang,
      rows: state.rows,
      rules: state.rules
    }));
  } catch (e) { /* storage unavailable */ }
}

function loadZenCache() {
  try {
    const raw = localStorage.getItem(LS_ZEN_CACHE);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || data.v !== 1 || !Array.isArray(data.rows)) return null;
    if (!validateZenRows(data.rows)) return null;
    if (data.lang !== state.lang) return null;   // 语言不同就别复用，重新抓
    return data;
  } catch (e) { return null; }
}

async function fetchLive(silent) {
  setRefreshing(true);
  let result = null;
  let key = "";
  const urls = zenSourceUrls();
  for (let i = 0; i < urls.length; i++) {
    try {
      const text = await fetchText(urls[i]);
      const parsed = validateZenSource(text);
      if (!parsed) continue;          // 结构变了就换下一个源，不要拿半截数据渲染
      result = parsed;
      key = ZEN_MIRROR_KEYS[i];
      break;
    } catch (e) { /* try next mirror */ }
  }
  setRefreshing(false);
  const stamp = new Date().toISOString();
  if (!result) {
    setStatus(state.sourceKey, state.fetchedAt || ZEN_SNAPSHOT_DATE, false);
    setBanner(true, t("bannerOffline", { src: sourceLabel(state.sourceKey) }));
    if (!silent) toast(t("toastFailed"));
    return;
  }
  const same = zenDataKey(result.rows, result.rules) === zenDataKey(state.rows, state.rules);
  applyData(result.rows, result.rules, key, stamp, true, true);
  setBanner(false);
  if (!silent) toast(same ? t("toastFresh") : t("toastUpdated"));
}

function applyData(rows, rules, key, when, save, online) {
  state.rows = rows;
  state.rules = rules;
  state.sourceKey = key;
  state.fetchedAt = when;
  state.online = online;
  if (save) saveZenCache(when);
  setStatus(key, when, online);
  render();
  probeZenModels();     // 首屏渲染完成后再异步做实时校验，不 await
}

/* ---------- 可选：本地代理实时可用性校验（任何失败都静默降级） ---------- */
async function probeZenModels() {
  try {
    const res = await fetchText2(PROXY_URL + "/api/zen/models", 3000);
    const data = JSON.parse(res);
    const ids = Array.isArray(data && data.data) ? data.data.map(m => String(m && m.id || "")) : [];
    if (!ids.length) throw new Error("empty");
    const set = new Set(ids);
    const missing = state.rows.filter(r => r.modelId && !set.has(r.modelId));
    const docIds = new Set(state.rows.map(r => r.modelId).filter(Boolean));
    state.live = ids;
    state.liveOnly = ids.filter(id => id && !docIds.has(id));
    state.liveMissing = missing.map(r => r.modelId);
    $("#th-live").hidden = false;
    render();
  } catch (e) {
    // 代理没起 / 403 / 超时 / 返回结构变了 → 静默保持隐藏，不影响主表格
    state.live = null;
    state.liveOnly = [];
    state.liveMissing = [];
    $("#th-live").hidden = true;
  }
}
function fetchText2(url, ms) {
  return new Promise((resolve, reject) => {
    const ctl = new AbortController();
    const timer = setTimeout(() => { ctl.abort(); reject(new Error("timeout")); }, ms || 3000);
    fetch(url, { signal: ctl.signal, cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(txt => { clearTimeout(timer); resolve(txt); })
      .catch(e => { clearTimeout(timer); reject(e); });
  });
}

/* ---------- 渲染 ---------- */
function levelRank(lv) {
  const i = PRIVACY_ORDER.indexOf(lv);
  return i === -1 ? PRIVACY_ORDER.length : i;
}

function visibleRows() {
  const q = state.query;
  let rows = state.rows.filter(r => {
    if (state.filter !== "all" && r.level !== state.filter) return false;
    if (!q) return true;
    return (r.name + " " + (r.modelId || "") + " " + (r.endpoint || "")).toLowerCase().indexOf(q) !== -1;
  });
  const dir = state.sortDir;
  rows.sort((a, b) => {
    let d = 0;
    if (state.sortKey === "level") d = levelRank(a.level) - levelRank(b.level);
    else if (state.sortKey === "name") d = String(a.name).localeCompare(String(b.name), "en");
    else d = String(a.modelId || "").localeCompare(String(b.modelId || ""), "en");
    if (d === 0) d = String(a.name).localeCompare(String(b.name), "en");
    return d * dir;
  });
  return rows;
}

function levelBadge(r) {
  const lv = r.level;
  const labelKey = "lv" + lv.charAt(0).toUpperCase() + lv.slice(1);
  const title = t(lv + "Title");
  const cls = "badge b-" + lv;
  return '<span class="' + cls + '" title="' + esc(title) + '">' + esc(t(labelKey)) + "</span>";
}

function rowHtml(r, i) {
  const c = { train: "#f87171", trial: "#fbbf24", vendor: "#60a5fa", zero: "#34d399", unknown: "#94a3b8" }[r.level] || "#94a3b8";
  const ep = shortEndpoint(r.endpoint);
  const epCell = isAltEndpoint(r.endpoint)
    ? '<td class="ep"><span class="alt" title="' + esc(t("epAltTitle")) + '">' + esc(ep) + "</span></td>"
    : '<td class="ep">' + esc(ep) + "</td>";
  const liveCell = state.live
    ? (state.liveMissing && state.liveMissing.indexOf(r.modelId) !== -1
      ? '<span class="badge b-off">' + esc(t("liveNo")) + "</span>"
      : '<span class="badge b-ok">' + esc(t("liveYes")) + "</span>")
    : '<span class="muted">—</span>';
  return '<tr class="lv-' + r.level + '" style="--c:' + c + '">' +
    '<td class="rank">' + (i + 1) + "</td>" +
    '<td class="name"><span class="name-inner" title="' + esc(r.name) + '">' + esc(r.name) + "</span></td>" +
    '<td class="mid">' + (r.modelId
      ? '<span class="mid-inner" title="' + esc(r.modelId) + '">' + esc(r.modelId) + '</span><button class="copy-id" data-copy="' + esc(r.modelId) + '" title="' + esc(t("copyIdTitle", { id: r.modelId })) + '"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>'
      : '<span class="muted">—</span>') + "</td>" +
    epCell +
    '<td class="note">' + esc(r.note || "—") + "</td>" +
    "<td>" + levelBadge(r) + "</td>" +
    '<td class="col-live">' + liveCell + "</td>" +
    "</tr>";
}

function renderStats() {
  const total = state.rows.length;
  const by = lv => state.rows.filter(r => r.level === lv).length;
  $("#st-total").textContent = total;
  $("#st-train").textContent = by("train");
  $("#st-trial").textContent = by("trial");
  $("#st-zero").textContent = by("zero");
  $("#st-total-l").textContent = t("stTotal");
  $("#st-train-l").textContent = t("stTrain");
  $("#st-trial-l").textContent = t("stTrial");
  $("#st-zero-l").textContent = t("stZero");
}

function renderLegend() {
  const counts = {};
  for (const lv of PRIVACY_ORDER) counts[lv] = state.rows.filter(r => r.level === lv).length;
  const chips = [{ key: "all", label: t("all"), color: "#818cf8", n: state.rows.length }];
  for (const lv of PRIVACY_ORDER) {
    chips.push({
      key: lv,
      label: t("lv" + lv.charAt(0).toUpperCase() + lv.slice(1)),
      color: { train: "#f87171", trial: "#fbbf24", vendor: "#60a5fa", zero: "#34d399", unknown: "#94a3b8" }[lv],
      n: counts[lv]
    });
  }
  $("#privacy-legend").innerHTML = chips.map(c =>
    '<span class="chip' + (state.filter === c.key ? " on" : "") + '" data-p="' + c.key + '">' +
    '<i class="cdot" style="--c:' + c.color + '"></i>' + esc(c.label) + " (" + c.n + ")</span>"
  ).join("");
}

function renderTable() {
  const rows = visibleRows();
  $("#tbody").innerHTML = rows.length
    ? rows.map(rowHtml).join("")
    : '<tr><td class="empty" colspan="7">' + esc(t("emptyTable")) + "</td></tr>";
  document.querySelectorAll("#thead th[data-key]").forEach(th => {
    if (th.dataset.key === state.sortKey) th.setAttribute("aria-sort", state.sortDir === 1 ? "ascending" : "descending");
    else th.removeAttribute("aria-sort");
  });
}

function renderDetails() {
  const modelRules = state.rules && state.rules.modelRules ? state.rules.modelRules : {};
  const vendorRules = state.rules && state.rules.vendorRules ? state.rules.vendorRules : {};
  const cards = [];
  for (const r of state.rows) {
    let text = modelRules[r.key] || "";
    let fromVendor = "";
    if (!text) {
      for (const v in vendorRules) {
        if (v && r.key.indexOf(v) !== -1) { fromVendor = t("detailVendor"); text = vendorRules[v]; break; }
      }
    }
    cards.push(
      '<div class="detail"><h3>' + levelBadge(r) + " " + esc(r.name) + "</h3>" +
      "<p>" + esc((fromVendor || "") + (text || t("detailNoRule"))) + "</p>" +
      '<div class="src">' + esc(t("docLink")) + "</div></div>"
    );
  }
  $("#details").innerHTML = cards.join("");
}

function renderFoot() {
  $("#foot-levels").textContent = t("footLevels");
  $("#foot-infer").innerHTML = esc(t("footInfer")).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const liveLi = $("#foot-live");
  if (state.live) {
    let txt = t("footLiveOn");
    if (state.liveOnly && state.liveOnly.length) txt += " " + t("footLiveDiff", { list: state.liveOnly.join(", ") });
    liveLi.textContent = txt;
  } else {
    liveLi.textContent = t("footLiveOff");
  }
  $("#src-label").textContent = t("srcLabel");
  const dl = $("#doc-link");
  dl.textContent = t("docLink");
  dl.href = docUrl();
  $("#snap-label").textContent = t("snapLabel");
}

function render() {
  renderStats();
  renderLegend();
  renderTable();
  renderDetails();
  renderFoot();
}

/* ---------- 状态 / 提示 ---------- */
function setStatus(key, when, online) {
  const dot = $("#status-dot");
  const txt = $("#status-text");
  dot.className = "dot " + (online ? "ok" : "warn");
  let label = sourceLabel(key);
  if (key !== "snapshot") {
    label += " · ";
    label += when ? formatStamp(when) : "—";
    if (!online) label += t("offlineSuffix");
  } else {
    label += " · " + ZEN_SNAPSHOT_DATE;
  }
  txt.textContent = label;
}
function formatStamp(iso) {
  try {
    const d = new Date(iso);
    const p = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  } catch (e) { return iso; }
}
function setBanner(show, text) {
  const el = $("#banner");
  el.className = show ? "show" : "";
  if (text) $("#banner-text").textContent = text;
}
function setRefreshing(on) {
  const btn = $("#refresh");
  btn.classList.toggle("spin", on);
  btn.disabled = on;
}
let toastTimer = null;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function copyModelId(text) {
  const done = () => toast(t("copied", { id: text }));
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  } catch (e) { toast(t("copyFailed")); }
}

function setLang(lang) {
  if (lang !== "zh" && lang !== "en") return;
  state.lang = lang;
  try { localStorage.setItem(LS_LANG, lang); } catch (e) { /* ignore */ }

    const u = new URL(location.href);
    if (lang === "zh") u.searchParams.delete("lang");
    else u.searchParams.set("lang", lang);
    history.replaceState(null, "", u.toString());
  } catch (e) { /* ignore */ }
  applyLangUi();
  render();
  setStatus(state.sourceKey, state.fetchedAt || ZEN_SNAPSHOT_DATE, state.online);
  fetchLive(true);

/* ---------- 事件 ---------- */
function bindEvents() {
  $("#refresh").addEventListener("click", () => fetchLive());
  $("#theme").addEventListener("click", toggleTheme);
  $("#lang").addEventListener("click", () => setLang(state.lang === "zh" ? "en" : "zh"));
  $("#search").addEventListener("input", e => {
    state.query = e.target.value.trim().toLowerCase();
    renderTable();
  });
  $("#thead").addEventListener("click", e => {
    const btn = e.target.closest("button[data-key]");
    if (!btn) return;
    const k = btn.dataset.key;
    if (state.sortKey === k) state.sortDir = -state.sortDir;
    else { state.sortKey = k; state.sortDir = 1; }
    renderTable();
  });
  $("#tbody").addEventListener("click", e => {
    const btn = e.target.closest(".copy-id[data-copy]");
    if (!btn) return;
    copyModelId(btn.dataset.copy);
  });
  $("#privacy-legend").addEventListener("click", e => {
    const chip = e.target.closest(".chip[data-p]");
    if (!chip) return;
    state.filter = chip.dataset.p;
    renderLegend();
    renderTable();
  });
}

/* ---------- 启动 ---------- */
function snapshotRules() {
  const modelRules = {};
  for (const pair of ZEN_SNAPSHOT_RULES) modelRules[pair[0]] = pair[1];
  const vendorRules = {};
  for (const pair of ZEN_SNAPSHOT_VENDORS) vendorRules[pair[0]] = pair[1];
  return { modelRules: modelRules, vendorRules: vendorRules };
}

function snapshotRows() {
  const rules = snapshotRules();
  const list = ZEN_SNAPSHOT_ROWS.map(s => ({ name: s[0], key: normZenName(s[0]) }));
  const notes = {};
  const levels = {};
  for (const s of ZEN_SNAPSHOT_ROWS) { notes[normZenName(s[0])] = s[4]; levels[normZenName(s[0])] = s[3]; }
  return buildRows(list, null, notes, rules, levels);
}

/* ---------- 启动 ---------- */
(function boot() {
  try {
    const savedTheme = localStorage.getItem(LS_THEME);
    if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    const bootLang = document.documentElement.getAttribute("data-lang");
    if (bootLang === "en" || bootLang === "zh") state.lang = bootLang;
    const sd = $("#snapshot-date");
    if (sd) sd.textContent = ZEN_SNAPSHOT_DATE;
  } catch (e) { /* ignore */ }
  applyLangUi();
  bindEvents();
  const cached = loadZenCache();
  if (cached) {
    applyData(cached.rows, cached.rules || { modelRules: {}, vendorRules: {} }, "cache", cached.fetchedAt || "", false, false);
  } else {
    applyData(snapshotRows(), snapshotRules(), "snapshot", ZEN_SNAPSHOT_DATE, false, false);
  }
  fetchLive();
})();
</script>
</body>
</html>
