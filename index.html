<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="description" content="OpenCode Go 全部模型的每 1M tokens 单价与每月使用额度速查：按价排序、自动同步官方文档、支持中英双语。All OpenCode Go model prices & monthly quotas, sorted and auto-synced from the official docs (EN/ZH).">
<title>OpenCode Go · 模型价格速查</title>
<script>
(function(){
  try{
    var q = new URLSearchParams(location.search).get("lang");
    var saved = localStorage.getItem("opengo-lang");
    var nav = (navigator.language || navigator.userLanguage || "").toLowerCase();
    var lang = q || saved || (nav.indexOf("zh") === 0 ? "zh" : "en");
    if (lang !== "zh" && lang !== "en") lang = "zh";
    document.documentElement.setAttribute("data-lang", lang);
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = lang === "zh" ? "OpenCode Go · 模型价格速查" : "OpenCode Go · Model Pricing Guide";
  }catch(e){}
})();
</script>
<style>
  :root{
    --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
    --radius: 14px;
  }
  [data-theme="dark"]{
    --bg:#0a0e1a;
    --glow1:rgba(99,102,241,.16);
    --glow2:rgba(34,211,238,.10);
    --card:rgba(255,255,255,.035);
    --card-solid:#0e1424;
    --border:rgba(255,255,255,.08);
    --border-strong:rgba(255,255,255,.14);
    --text:#e7eaf3;
    --muted:#9aa3ba;
    --hover:rgba(255,255,255,.035);
    --thead-bg:rgba(13,19,38,.92);
    --bar-track:rgba(255,255,255,.08);
    --accent:#818cf8;
    --ok:#34d399;
    --warn:#fbbf24;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  [data-theme="light"]{
    --bg:#f2f4fa;
    --glow1:rgba(99,102,241,.12);
    --glow2:rgba(34,211,238,.12);
    --card:#ffffff;
    --card-solid:#ffffff;
    --border:rgba(15,23,42,.10);
    --border-strong:rgba(15,23,42,.18);
    --text:#1b2334;
    --muted:#4f596e;
    --hover:rgba(15,23,42,.035);
    --thead-bg:rgba(255,255,255,.94);
    --bar-track:rgba(15,23,42,.08);
    --accent:#5a63e8;
    --ok:#0e9f6e;
    --warn:#d97706;
    --shadow:0 8px 30px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    font-size:15px;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    background:
      radial-gradient(900px 480px at 12% -8%, var(--glow1), transparent 60%),
      radial-gradient(900px 480px at 88% -12%, var(--glow2), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:background .3s ease, color .3s ease;
  }
  .wrap{max-width:none;width:100%;margin:0 auto;padding:30px clamp(14px,2.5vw,34px) 64px}

  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .brand-badge{
    width:46px;height:46px;flex:none;border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:19px;color:#fff;
    background:linear-gradient(135deg,#6366f1,#22d3ee);
    box-shadow:0 6px 20px rgba(99,102,241,.4);
  }
  .brand h1{margin:0;font-size:23px}
  .brand p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
  .hactions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  .status{
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--muted);
    border:1px solid var(--border);border-radius:999px;
    padding:6px 13px;background:var(--card);
    max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .status b{color:var(--text);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  #peak-next{margin-left:2px;font-size:12px}
  .live-tag{
    display:inline-flex;align-items:center;gap:5px;margin-left:7px;vertical-align:1px;
    font-size:11.5px;font-weight:600;color:var(--text);
    border:1px solid var(--border-strong);border-radius:999px;padding:2px 9px;
    background:var(--card);
  }
  .live-tag i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);animation:pulse 1.6s ease infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

  .btn{
    display:inline-flex;align-items:center;gap:7px;
    font:inherit;font-size:13.5px;color:var(--text);
    background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:8px 14px;cursor:pointer;
    transition:all .18s ease;
  }
  .btn:hover{border-color:var(--border-strong);transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn:active{transform:translateY(0)}
  .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn.primary{background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(34,211,238,.18));border-color:rgba(99,102,241,.45)}
  /* 「Zen 免费 / 用量 / Go 价格」是页面重点功能入口：统一用主题强调色（靛蓝）打底，
     和左侧时间、低峰倒计时这类灰色备注胶囊明显区分开 */
  .btn.nav{
    background:linear-gradient(180deg,rgba(129,140,248,.24),rgba(129,140,248,.12));
    border-color:rgba(129,140,248,.55);
    color:var(--accent);
    font-weight:600;
  }
  .btn.nav:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(99,102,241,.30)}
  .spin svg{animation:rot .9s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* ---------- banner ---------- */
  #banner{
    display:none;align-items:center;gap:10px;
    font-size:13px;color:var(--warn);
    background:rgba(251,191,36,.09);
    border:1px solid rgba(251,191,36,.3);
    border-radius:11px;padding:10px 15px;margin-bottom:16px;
  }
  #banner.show{display:flex}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 18px;
  }
  .stat .v{font-family:var(--mono);font-size:26px;font-weight:700}
  .stat .l{font-size:13px;color:var(--muted);margin-top:5px}

  /* ---------- controls ---------- */
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .search{
    position:relative;flex:1 1 240px;max-width:330px;
  }
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
  .search input{
    width:100%;font:inherit;font-size:14.5px;color:var(--text);
    background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:9px 12px 9px 36px;outline:none;
    transition:border-color .18s ease;
  }
  .search input:focus{border-color:var(--accent)}
  .search input::placeholder{color:var(--muted)}

  #legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #privacy-legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #privacy-legend .sep{width:1px;height:20px;background:var(--border-strong);margin:0 2px}
  #privacy-legend .chip.on{border-color:var(--accent);font-weight:600;box-shadow:0 0 0 1px var(--accent) inset}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    font:inherit;font-size:13.5px;color:var(--text);
    background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:7px 13px;cursor:pointer;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--border-strong)}
  .chip .cdot{width:10px;height:10px;border-radius:50%;background:var(--c,#94a3b8);flex:none}
  .chip.off{opacity:.32}
  .chip.all{border-color:var(--border-strong);font-weight:600}

  /* ---------- table ---------- */
  .table-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
    width:fit-content;max-width:100%;
  }
  .table-wrap{overflow:auto;max-height:72vh}
  table{width:auto;border-collapse:separate;border-spacing:0;font-size:14.5px}
  thead th{
    position:sticky;top:0;z-index:5;
    background:var(--thead-bg);backdrop-filter:blur(10px);
    font-size:12.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
    color:var(--muted);text-align:left;
    padding:12px 10px;border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  thead th.num{text-align:right}
  .th-btn{
    font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;
    background:none;border:none;padding:0;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;
  }
  .th-btn:hover{color:var(--text)}
  th[aria-sort="ascending"] .th-btn,th[aria-sort="descending"] .th-btn{color:var(--accent)}
  .ic{font-size:9px;line-height:1}
  th[aria-sort="ascending"] .ic::after{content:"▲"}
  th[aria-sort="descending"] .ic::after{content:"▼"}
  th[data-key]:not([aria-sort]) .th-btn:hover .ic::after{content:"▲";opacity:.35}

  tbody td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .15s ease}
  tbody tr:hover{background:var(--hover)}
  td.rank{
    font-family:var(--mono);font-size:13px;color:var(--muted);width:40px;
    box-shadow:inset 3px 0 0 0 var(--c,transparent);
  }
  td.num,th.num{font-family:var(--mono);text-align:right;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
  td.num.strong{font-weight:700;color:var(--text)}
  .padzero{opacity:0;user-select:none}
  td.mid{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
  .mid-inner{display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  .copy-id{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;margin-left:6px;vertical-align:-6px;
    background:none;border:none;border-radius:7px;cursor:pointer;
    color:var(--muted);transition:all .15s ease;padding:0;
  }
  .copy-id svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .copy-id:hover{color:var(--accent);background:var(--hover)}
  .copy-id.copied{color:var(--ok)}
  .muted{color:var(--muted)}
  td.name{font-weight:600;font-size:14.5px;white-space:nowrap}
  .name-inner{display:inline-block;max-width:230px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}

  .chip-sm{
    display:inline-block;font-size:13px;font-weight:600;
    color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--c) 34%,transparent);
    border-radius:999px;padding:3px 10px;white-space:nowrap;
  }
  @supports not (background: color-mix(in srgb, red 10%, blue)){
    .chip-sm{background:var(--card);border-color:var(--border-strong)}
  }
  .badge{
    display:inline-block;font-size:12.5px;border-radius:999px;padding:3px 10px;white-space:nowrap;
    border:1px solid transparent;
  }
  .b-len{color:var(--muted);background:var(--bar-track);border-color:var(--border)}
  .b-off{color:var(--ok);background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.32)}
  .b-peak{color:var(--warn);background:rgba(251,191,36,.1);border-color:rgba(251,211,36,.32)}
  .b-train{color:#f87171;background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.4)}
  .b-keep{color:var(--warn);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.32)}
  .b-zero{color:var(--muted);background:var(--bar-track);border-color:var(--border)}
  .b-promo{color:#22d3ee;background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.4)}
  .allow-old{opacity:.45;text-decoration:line-through;font-size:12.5px}
  tr.is-train{box-shadow:inset 3px 0 0 0 rgba(248,113,113,.7)}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
  .seg button{font:inherit;font-size:13px;color:var(--muted);background:none;border:none;border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:linear-gradient(135deg,rgba(99,102,241,.28),rgba(34,211,238,.22));color:var(--text);font-weight:600}

  .fx-rate{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--muted);
    border:1px solid var(--border);border-radius:999px;
    padding:5px 11px;background:var(--card);white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .fx-rate[hidden]{display:none}

  .allow{display:flex;align-items:center;justify-content:flex-end;gap:9px}
  .allow-wrap{display:inline-block;text-align:right;line-height:1.9}
  .bar{display:inline-block;width:58px;height:4px;border-radius:99px;background:var(--bar-track);overflow:hidden;flex:none}
  .bar i{display:block;height:100%;border-radius:99px}

  td.empty{text-align:center;color:var(--muted);padding:44px 0;font-size:14px}

  /* ---------- footer ---------- */
  footer{margin-top:22px;font-size:13px;color:var(--muted);line-height:2}
  footer ul{margin:6px 0;padding-left:18px}
  footer .src{margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
    background:var(--card-solid);border:1px solid var(--border-strong);
    color:var(--text);font-size:14px;border-radius:11px;padding:11px 19px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transition:all .28s ease;z-index:99;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px}
  ::-webkit-scrollbar-track{background:transparent}

  @media (max-width:860px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .col-cw{display:none}
  }
  @media (max-width:620px){
    .wrap{padding:20px 14px 48px}
    .col-cr{display:none}
    .brand p{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-badge">Go</div>
      <div>
        <h1 id="brand-title">OpenCode Go · 模型价格速查</h1>
        <p id="brand-sub">每 1M tokens 单价与每月使用额度 · 从便宜到贵 · 每次打开自动同步官方最新数据</p>
      </div>
    </div>
    <div class="hactions">
      <span class="status" id="status" title="数据状态"><span class="dot" id="status-dot"></span><span id="status-text">加载中…</span></span>
      <span class="status" id="peak-pill" title="DeepSeek 计费时段"><span class="dot" id="peak-dot"></span><span id="peak-text">…</span><span class="muted" id="peak-next"></span></span>
      <a class="btn nav" href="zen.html" title="Zen 免费模型与隐私" id="zen-btn">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8z"/></svg>
        <span id="zen-label">Zen 免费</span>
      </a>
      <a class="btn nav" href="usage.html" title="查看用量" id="usage-btn">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg>
        <span id="usage-label">用量</span>
      </a>
      <button class="btn primary" id="refresh">
        <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6"/><path d="M2.5 22v-6h6"/><path d="M2 12a10 10 0 0 1 17.2-7L21.5 8"/><path d="M22 12a10 10 0 0 1-17.2 7L2.5 16"/></svg>
        <span id="refresh-label">刷新数据</span>
      </button>
      <button class="btn" id="lang" title="切换语言 / Switch language">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="lang-label">EN</span>
      </button>
      <button class="btn" id="theme" title="切换主题">
        <svg viewBox="0 0 24 24" id="theme-ic"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="theme-label">浅色</span>
      </button>
      <!-- GitHub 仓库链接：纯静态跳转，新窗口打开，样式沿用 .btn；图标为实心填充故覆盖描边 -->
      <a class="btn" href="https://github.com/AXIRYYYY/opencode-go-pricing" target="_blank" rel="noopener" id="github-btn" title="觉得有用？去 GitHub 给个 Star ⭐ 支持一下">
        <svg viewBox="0 0 16 16" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span id="github-label">GitHub 求 Star ⭐</span>
      </a>
    </div>
  </header>

  <div id="banner">
    <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex:none"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    <span id="banner-text"></span>
  </div>

  <section class="stats">
    <div class="stat"><div class="v" id="st-count">—</div><div class="l" id="st-count-l">价格档位</div></div>
    <div class="stat"><div class="v" id="st-series">—</div><div class="l" id="st-series-l">模型系列</div></div>
    <div class="stat"><div class="v" id="st-min">—</div><div class="l" id="st-min-l">最低输入价 / 1M</div></div>
    <div class="stat"><div class="v" id="st-max">—</div><div class="l" id="st-max-l">最高输入价 / 1M</div></div>
  </section>

  <div class="controls">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search" placeholder="搜索模型、系列或价格档…" autocomplete="off">
    </div>
    <div id="legend"></div>
    <div id="privacy-legend" title="按隐私筛选"></div>
    <div class="seg" id="price-mode" title="切换价格模式：官方原价 vs 月费折算价（单价÷额度×$10，可与其他平台比价）">
      <button data-m="price" class="on">$/1M</button>

<script>
'use strict';
/*__PARSE_BEGIN__*/
const SERIES_COLORS = {
  "Grok": "#818cf8",
  "GPT": "#2dd4bf",
  "GLM": "#60a5fa",
  "Kimi": "#c084fc",
  "LongCat": "#fb923c",
  "MiMo": "#f472b6",
  "MiniMax": "#22d3ee",
  "Muse Spark": "#facc15",
  "Qwen": "#f87171",
  "DeepSeek": "#34d399",
  "Hy": "#a78bfa",
  "Space Bunny": "#7dd3fc",
  "其他": "#94a3b8"
};
const SERIES_ORDER = ["Grok","GPT","GLM","Kimi","LongCat","MiMo","MiniMax","Muse Spark","Qwen","DeepSeek","Hy","Space Bunny","其他"];
const SERIES_RULES = [
  ["muse spark", "Muse Spark"],
  ["grok", "Grok"],
  ["gpt", "GPT"],
  ["glm", "GLM"],
  ["kimi", "Kimi"],
  ["longcat", "LongCat"],
  ["mimo", "MiMo"],
  ["minimax", "MiniMax"],
  ["qwen", "Qwen"],
  ["deepseek", "DeepSeek"],
  ["hy", "Hy"],
  // 2026-10-07 官方新增模型 Space Bunny；detectSeries 用 startsWith，所以名字要完整匹配
  ["space bunny", "Space Bunny"]
];

function parseUsd(cell) {
  if (cell == null) return null;
  const s = String(cell).replace(/\\/g, "").trim();
  if (!s || /^[-—–]+$/.test(s)) return null;
  if (/^free$/i.test(s) || /^免费$/.test(s)) return 0;
  const m = s.replace(/[^0-9.]/g, "");
  if (!m) return null;
  const v = parseFloat(m);
  return Number.isFinite(v) ? v : null;
}

function splitModelCell(raw) {
  let s = String(raw || "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").trim();
  const m = s.match(/\(([^)]*)\)/);
  let tier = null;
  if (m) {
    tier = m[1].trim() || null;
    s = s.replace(m[0], "").trim();
  }
  return { name: s, tier };
}

function detectSeries(name) {
  const n = String(name || "").toLowerCase();
  for (const [prefix, series] of SERIES_RULES) {
    if (n.startsWith(prefix)) return series;
  }
  return "其他";
}

function parseAllowanceCell(cell) {
  let s = cell == null ? "" : String(cell);
  s = s.replace(/<del[^>]*>([\s\S]*?)<\/del>/gi, "~~$1~~").replace(/\\/g, "").trim();
  if (!s || /^[-—–]+$/.test(s)) return { allowance: null, promoOld: null, promoNote: "" };
  const plain = s.replace(/<[^>]+>/g, " ").replace(/\*/g, "").trim();
  // 无限制额度（如 Union Alpha Free "**无限制**<br /><small>限时</small>"）：
  // 用 9999 这个哨兵值表示"+∞"，排序/折算都适用，渲染层显示为「不限」
  if (/无限制|无限|不限量|不限|免费额度|unlimited|unbounded/i.test(plain)) {
    const sm = s.match(/<small[^>]*>([\s\S]*?)<\/small>/i);
    const note = sm ? sm[1].replace(/<[^>]+>/g, "").trim() : "";
    return { allowance: 9999, promoOld: null, promoNote: note };
  }
  const nums = [];
  const re = /\d+(?:\.\d+)?/g;
  let m;
  while ((m = re.exec(s)) && nums.length < 2) nums.push(parseFloat(m[0]));
  const isPromo = nums.length === 2 && /~~|4x|结束/.test(s);
  if (isPromo) {
    let note = "";
    const sm = s.match(/<small[^>]*>([\s\S]*?)<\/small>/i);
    if (sm) note = sm[1].replace(/<[^>]+>/g, "").trim();
    else note = s.replace(/~~[^~]*~~/g, "").replace(/<br\s*\/?>/gi, "|").replace(/<[^>]+>/g, " ")
      .replace(/\$[\d.]+/g, " ").replace(/\|/g, " ").replace(/\s+/g, " ").trim();
    return { allowance: nums[1], promoOld: nums[0], promoNote: note || "限时提升" };
  }
  return { allowance: nums.length ? nums[0] : null, promoOld: null, promoNote: "" };
}

function normalizeRow(raw) {
  const nameCell = raw[0];
  const { name, tier } = splitModelCell(nameCell);
  const al = parseAllowanceCell(raw[5]);
  return {
    name,
    tier,
    series: detectSeries(name),
    input: parseUsd(raw[1]),
    output: parseUsd(raw[2]),
    cacheRead: parseUsd(raw[3]),
    cacheWrite: parseUsd(raw[4]),
    allowance: al.allowance,
    promoOld: al.promoOld || null,
    promoNote: al.promoNote || ""
  };
}

function parseMdPricingTable(md) {
  const lines = String(md || "").split(/\r?\n/);
  let head = -1;
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const hasIn = l.includes("输入") || /\binput\b/i.test(l);
    const hasOut = l.includes("输出") || /\boutput\b/i.test(l);
    const hasLimit = l.includes("每月限制") || l.includes("使用额度") || /monthly limit/i.test(l);
    if (l.includes("|") && hasIn && hasOut && hasLimit) {
      head = i;
      break;
    }
  }
  if (head === -1) return null;
  const rows = [];
  for (let i = head + 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line.startsWith("|")) {
      if (rows.length) break;
      continue;
    }
    const cells = line.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
    if (cells.length < 6) continue;
    if (cells.every(c => /^:?-{2,}:?$/.test(c) || c === "")) continue;
    if (!cells[1] || cells[1].includes("输入") || /^input$/i.test(cells[1])) continue;
    rows.push([cells[0], cells[1], cells[2], cells[3], cells[4], cells[5]]);
  }
  return rows.length ? rows.map(normalizeRow) : null;
}

function parseHtmlPricingTable(html) {
  try {
    const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
    for (const tb of doc.querySelectorAll("table")) {
      const firstRow = tb.querySelector("tr");
      if (!firstRow) continue;
      const ths = [...firstRow.children].map(c => (c.textContent || "").trim());
      if (ths.length < 6) continue;
      if (!(ths[1].includes("输入") || /^input$/i.test(ths[1]))) continue;
      if (!(ths[5].includes("每月限制") || ths[5].includes("使用额度") || /monthly limit/i.test(ths[5]))) continue;
      const raw = [];
      for (const tr of tb.querySelectorAll("tr")) {
        const cells = [...tr.children];
        const td = cells.map(c => (c.textContent || "").trim());
        if (td.length < 6 || td[1].includes("输入") || /^input$/i.test(td[1])) continue;
        const allowHtml = cells[5] ? (cells[5].innerHTML || td[5]) : td[5];
        raw.push([td[0], td[1], td[2], td[3], td[4], allowHtml]);
      }
      if (raw.length) return raw.map(normalizeRow);
    }
  } catch (e) { /* fallthrough */ }
  return null;
}

function validateRows(rows) {
  return Array.isArray(rows)
    && rows.length >= 10
    && rows.every(r => r && typeof r.name === "string" && r.name.length > 0
      && typeof r.input === "number"
      && typeof r.allowance === "number");
}

function normPrivacyName(s) {
  return String(s || "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/\([^)]*\)/g, "").replace(/[_‐‑‒–—―]/g, "-")
    .replace(/\s+/g, "").replace(/-/g, "").toLowerCase();
}

function parsePrivacySection(md) {
  const text = String(md || "");
  const lines = text.split(/\r?\n/);
  let head = -1;
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const hasTrain = l.includes("模型训练") || /model training/i.test(l);
    const hasRetain = l.includes("数据留存") || /data retention/i.test(l);
    if (l.includes("|") && hasTrain && hasRetain) { head = i; break; }
  }
  if (head === -1) return null;
  const table = [];
  for (let i = head + 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line.startsWith("|")) { if (table.length) break; continue; }
    const cells = line.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
    if (cells.length < 3) continue;
    if (cells.every(c => /^:?-{2,}:?$/.test(c) || c === "")) continue;
    if (cells[1].includes("模型训练") || /model training/i.test(cells[1])) continue;
    table.push({ model: cells[0], train: cells[1], retain: cells[2] });
  }
  if (!table.length) return null;
  const notes = [];
  let inNotes = false;
  for (let i = head + 1; i < lines.length; i++) {
    const line = lines[i];
    if (/^##\s+(目标|Goals)/.test(line.trim())) break;
    if (!inNotes) {
      if (/^\s*-\s*\*\*/.test(line) && table.length && line.includes("**") && !line.includes("|")) inNotes = true;
      else continue;
    }
    const m = line.match(/^\s*-\s*\*\*(.+?):\*\*\s*(.*)$/);
    if (m) notes.push({ model: m[1].trim(), text: m[2].trim() });
    else if (/^\s*-\s/.test(line)) break;
  }
  return { table, notes: notes.length ? notes : null };
}

function parseHtmlPrivacySection(html) {
  try {
    const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
    for (const tb of doc.querySelectorAll("table")) {
      const firstRow = tb.querySelector("tr");
      if (!firstRow) continue;
      const ths = [...firstRow.children].map(c => (c.textContent || "").trim());
      if (ths.length < 3 || !(ths.join("").includes("模型训练") || /model training/i.test(ths.join(" ")))) continue;
      const table = [];
      for (const tr of tb.querySelectorAll("tr")) {
        const td = [...tr.children].map(c => (c.textContent || "").trim());
        if (td.length < 3 || td[1].includes("模型训练") || /model training/i.test(td[1])) continue;
        table.push({ model: td[0], train: td[1], retain: td[2] });
      }
      if (table.length) {
        const notes = [];
        let el = tb.parentElement;
        const scope = el ? el.innerHTML : "";
        const re = /<li[^>]*>\s*<strong>([^<:]+):?<\/strong>\s*([\s\S]*?)<\/li>/g;
        let m;
        while ((m = re.exec(scope)) && notes.length < 12) {
          const div = document.createElement("div");
          div.innerHTML = m[2];
          notes.push({ model: m[1].trim(), text: div.textContent.trim() });
        }
        return { table, notes: notes.length ? notes : null };
      }
    }
  } catch (e) { /* fallthrough */ }
  return null;
}

function mergePrivacy(rows, priv) {
  const map = new Map();
  if (priv && Array.isArray(priv.table)) {
    for (const p of priv.table) map.set(normPrivacyName(p.model), p);
  }
  for (const r of rows) {
    const hit = map.get(normPrivacyName(r.name))
      || map.get(normPrivacyName(r.name.replace(/spark\s*1\.\d/i, "spark")));
    const train = hit ? String(hit.train || "").trim() : "";
    const retain = hit ? String(hit.retain || "").trim() : "";
    r.training = /^(是|yes|y)\b/i.test(train) || train === "是";
    r.retain = retain || "";
    const dm = String(retain).match(/^(\d+)/);
    r.retainDays = dm ? parseInt(dm[1], 10) : null;
    r.notZdr = /非\s*ZDR|not\s*ZDR/i.test(String(retain));
  }
  return rows;
}

function privacyRank(r) {
  if (r.training) return 0;
  if (r.retainDays != null && r.retainDays > 0) return 1;
  if (r.notZdr) return 1;
  return 2;
}

function stripTierSuffix(name) {
  return String(name || "").replace(/\[[^\]]*\]\([^)]*\)/g, "").replace(/\([^)]*\)/g, "").trim();
}

function parseModelIdTable(md) {
  const lines = String(md || "").split(/\r?\n/);
  let head = -1, idCol = -1, nameCol = 0;
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (!l.includes("|")) continue;
    const probe = l.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
    const col = probe.findIndex(c => c.includes("模型 ID") || c.includes("模型ID") || /model\s*id/i.test(c));
    if (col !== -1) { head = i; idCol = col; nameCol = 0; break; }
  }
  if (head === -1) return null;
  const map = {};
  for (let i = head + 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line.startsWith("|")) { if (Object.keys(map).length) break; continue; }
    const cells = line.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
    if (cells.length <= idCol) continue;
    if (cells.every(c => /^:?-{2,}:?$/.test(c) || c === "")) continue;
    const name = cells[nameCol], id = cells[idCol];
    if (!name || !id || id.includes("模型 ID") || /^model\s*id$/i.test(id)) continue;
    map[name] = id;
  }
  return Object.keys(map).length ? map : null;
}

function parseHtmlModelIdTable(html) {
  try {
    const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
    for (const tb of doc.querySelectorAll("table")) {
      const firstRow = tb.querySelector("tr");
      if (!firstRow) continue;
      const ths = [...firstRow.children].map(c => (c.textContent || "").trim());
      const idCol = ths.findIndex(c => c.includes("模型 ID") || c.includes("模型ID") || /model\s*id/i.test(c));
      if (idCol === -1) continue;
      const map = {};
      for (const tr of tb.querySelectorAll("tr")) {
        const td = [...tr.children].map(c => (c.textContent || "").trim());
        if (td.length <= idCol || td[idCol].includes("模型 ID") || /^model\s*id$/i.test(td[idCol])) continue;
        if (td[0] && td[idCol]) map[td[0]] = td[idCol];
      }
      if (Object.keys(map).length) return map;
    }
  } catch (e) { /* fallthrough */ }
  return null;
}

function mergeModelIds(rows, map) {
  const norm = new Map();
  if (map) {
    for (const [name, id] of Object.entries(map)) norm.set(normPrivacyName(name), id);
  }
  for (const r of rows) {
    const base = stripTierSuffix(r.name);
    const id = norm.get(normPrivacyName(base))
      || norm.get(normPrivacyName(base.replace(/spark\s*1\.\d/i, "spark")));
    r.modelId = id || null;
  }
  return rows;
}

function dataKey(rows) {
  return JSON.stringify(rows.map(r => [r.name, r.tier, r.input, r.output, r.cacheRead, r.cacheWrite, r.allowance, r.promoOld || 0, r.training ? 1 : 0, r.retain || ""]));
}

function tierLabel(tier) {
  if (!tier) return "";
  const s = String(tier);
  if (/off-peak/i.test(s)) return t("tierOff");
  if (/peak/i.test(s)) return t("tierPeak");
  return s;
}

function isDeepSeekPeak(d) {
  const day = d.getUTCDay();
  if (day === 0 || day === 6) return false;
  const h = d.getUTCHours() + d.getUTCMinutes() / 60;
  return (h >= 1 && h < 4) || (h >= 6 && h < 10);
}

function nextDeepSeekTransition(d) {
  for (let i = 0; i < 9; i++) {
    const day = new Date(d.getTime() + i * 86400000);
    if (day.getUTCDay() === 0 || day.getUTCDay() === 6) continue;
    for (const h of [1, 4, 6, 10]) {
      const t = new Date(Date.UTC(day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate(), h, 0, 0));
      if (t > d) return t;
    }
  }
  return null;
}

function fmtCountdown(ms) {
  const mins = Math.max(0, Math.ceil(ms / 60000));
  const dd = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
  const zh = state.lang === "zh";
  if (dd > 0) return t("countdownDays", { d: dd, h: h > 0 ? h + (zh ? "小时" : "h") : "" });
  if (h > 0) return t("countdownHours", { h: h, m: m > 0 ? m + (zh ? "分" : "m") : "" });
  return t("countdownMins", { m: m });
}
/*__PARSE_END__*/

function hexToRgb(hex) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function tint(hex, a) {
  const [r, g, b] = hexToRgb(hex);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}
function colorOf(series) {
  return SERIES_COLORS[series] || "#94a3b8";

const PRICE_FRAC = 6; // 小数部分统一占位到 6 位（不足补不可见 0），小数点纵向对齐
const MONTHLY_FEE = 10; // Go 月费 $10，折算按此计算
const RATE_SNAPSHOT = { value: 6.7082, date: "2026-09-11", source: "内置快照", fetchedAt: 0 };

function rateNow() {
  return (state.rate && state.rate.value) || RATE_SNAPSHOT.value;
}
function curSym() {
  return state.currency === "cny" ? "¥" : "$";
}
function convCur(v) {
  return state.currency === "cny" ? v * rateNow() : v;
}
function fmtPlainNum(v) {
  if (Number.isInteger(v)) return v.toFixed(2);
  const s = String(Number(v.toPrecision(7)));
  const dot = s.indexOf(".");
  const frac = dot === -1 ? 0 : s.length - dot - 1;
  return frac > PRICE_FRAC ? Number(v.toFixed(PRICE_FRAC)).toString() : s;
}
function padZero(s) {
  const dot = s.indexOf(".");
  const fracLen = dot === -1 ? 0 : s.length - dot - 1;
  return fracLen < PRICE_FRAC ? s + '<span class="padzero">' + "0".repeat(PRICE_FRAC - fracLen) + "</span>" : s;
}
function fmtPrice(v, allowance) {
  if (v == null) return '<span class="muted">—</span>';
  const sym = curSym();
  if (state.ratioMode) {
    if (allowance == null || !allowance) return '<span class="muted">—</span>';
    const q = convCur(v / allowance * MONTHLY_FEE);
    const tip = t("ratioTip", { v: v, a: allowance, fee: MONTHLY_FEE })
      + (state.currency === "cny" ? t("ratioTipCny", { rate: rateNow().toFixed(4) }) : "");
    return '<span title="' + esc(tip) + '">' + sym + q.toFixed(4) + "</span>";
  }
  return sym + padZero(fmtPlainNum(convCur(v)));
}
function effVal(v, allowance) {
  if (v == null) return null;
  if (state.ratioMode && typeof v === "number") {
    if (allowance == null || !allowance) return null;
    return v / allowance * MONTHLY_FEE;
  }
  return v;
}
function tierClass(t) {
  if (!t) return "";
  const s = t.toLowerCase();
  if (s.includes("off-peak")) return "b-off";
  if (s.includes("peak")) return "b-peak";
  return "b-len";
}

let toastTimer = null;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}

function timeStr(iso) {
  try {
    return new Date(iso).toLocaleTimeString(localeTag(), { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch (e) { return ""; }
}

function updatePeakStatus() {
  const now = new Date();
  const peak = isDeepSeekPeak(now);
  const next = nextDeepSeekTransition(now);
  const pill = $("#peak-pill");
  if (pill) {
    $("#peak-dot").className = "dot " + (peak ? "warn" : "ok") + " pulse";
    $("#peak-text").textContent = peak ? t("peakHigh") : t("peakLow");
    $("#peak-next").textContent = next ? "· " + fmtCountdown(next - now) : "";
    pill.title = peak ? t("peakPillHigh") : t("peakPillLow");
  }
  const changed = state.peak !== undefined && state.peak !== peak;
  state.peak = peak;
  if (changed && state.rows.length) renderTable();
}

function statusLabel(key) {
  const map = {
    github: "srcGithub", jsdelivr: "srcJsdelivr", ghproxy: "srcGhproxy",
    ghproxy2: "srcGhproxy2", ghfast: "srcGhfast", cache: "srcCache", snapshot: "srcSnapshot"
  };
  return t(map[key] || "srcSnapshot");
}

function setBanner(show, text) {

function setRefreshing(on) {

function statText(v) {
  if (v == null) return "—";
  return curSym() + (state.ratioMode ? convCur(v).toFixed(4) : fmtPlainNum(convCur(v)));
}

function renderStats() {
  const rows = state.rows;
  const inputs = rows.map(r => effVal(r.input, r.allowance)).filter(v => v != null);
  $("#st-count").textContent = rows.length;
  $("#st-series").textContent = new Set(rows.map(r => r.series)).size;
  const minL = $("#st-min-l"), maxL = $("#st-max-l");
  if (minL) minL.textContent = t(state.ratioMode ? "stMinRatio" : "stMinPrice");
  if (maxL) maxL.textContent = t(state.ratioMode ? "stMaxRatio" : "stMaxPrice");
  if (!inputs.length) { $("#st-min").textContent = "—"; $("#st-max").textContent = "—"; return; }
  const lo = Math.min.apply(null, inputs), hi = Math.max.apply(null, inputs);
  $("#st-min").textContent = statText(lo);
  $("#st-max").textContent = statText(hi);
}

function presentSeries() {
  const set = new Set(state.rows.map(r => r.series));
  return SERIES_ORDER.filter(s => set.has(s)).concat([...set].filter(s => !SERIES_ORDER.includes(s)));
}

function renderLegend() {
  const legend = $("#legend");
  const html = ['<button class="chip all" data-s="*">' + esc(t("legendAll")) + "</button>"];
  for (const s of presentSeries()) {
    const off = state.off.has(s) ? " off" : "";
    html.push('<button class="chip' + off + '" data-s="' + esc(s) + '" style="--c:' + colorOf(s) + '"><i class="cdot"></i>' + esc(seriesLabel(s)) + "</button>");
  }
  legend.innerHTML = html.join("");
}

function cmp(a, b, key, dir) {
  if (key === "privacy") return (privacyRank(a) - privacyRank(b)) * dir || a.name.localeCompare(b.name, localeTag()) * dir;
  const va = effVal(a[key], a.allowance), vb = effVal(b[key], b.allowance);
  if (key === "allowance") {
    const xa = a.allowance, xb = b.allowance;
    if (xa == null && xb == null) return 0;
    if (xa == null) return 1;
    if (xb == null) return -1;
    return (xa - xb) * dir;
  }
  if (va == null && vb == null) return 0;
  if (va == null) return 1;
  if (vb == null) return -1;
  if (typeof va === "string") return va.localeCompare(vb, localeTag()) * dir;
  return (va - vb) * dir;
}

function isRetained(r) {
  if (r.notZdr) return true;
  return r.retainDays != null && r.retainDays > 0;
}

function matchPrivacy(r) {
  const f = state.privacyFilter;
  if (f === "train") return !!r.training;
  if (f === "retain") return !r.training && isRetained(r);
  if (f === "zero") return !r.training && r.retainDays === 0;
  return true;
}

function renderPrivacyLegend() {
  const el = $("#privacy-legend");
  if (!el) return;
  const rows = state.rows;
  const nTrain = rows.filter(r => r.training).length;
  const nRetain = rows.filter(r => !r.training && isRetained(r)).length;
  const nZero = rows.filter(r => !r.training && r.retainDays === 0).length;
  const opts = [
    ["all", t("privAll", { n: rows.length }), ""],
    ["train", t("privTrain", { n: nTrain }), "#f87171"],
    ["retain", t("privRetain", { n: nRetain }), "#fbbf24"],
    ["zero", t("privZero", { n: nZero }), "#94a3b8"]
  ];
  el.innerHTML = '<span class="sep"></span>' + opts.map(([k, label, c]) =>
    '<button class="chip' + (state.privacyFilter === k ? " on" : "") + '" data-p="' + k + '"' +
    (c ? ' style="--c:' + c + '"><i class="cdot"></i>' : ">") + esc(label) + "</button>"
  ).join("");
}

function visibleRows() {
  const q = state.query;
  return state.rows
    .filter(r => !state.off.has(r.series))
    .filter(matchPrivacy)
    .filter(r => !q || (r.name + " " + (r.tier || "") + " " + tierLabel(r.tier) + " " + r.series + " " + seriesLabel(r.series) + " " + (r.training ? "训练 training" : "") + " " + retainLabel(r)).toLowerCase().includes(q))
    .sort((a, b) => cmp(a, b, state.sortKey, state.sortDir));
}

function retainLabel(r) {
  if (r.notZdr) return t("notZdr");
  if (r.retainDays != null) return t("days", { n: r.retainDays });
  return r.retain || "";
}

function privacyCell(r) {
  const parts = [];
  if (r.training) parts.push('<span class="badge b-train" title="' + esc(t("trainBadgeTitle")) + '">' + esc(t("trainBadge")) + "</span>");
  if (r.retainDays === 0) {
    parts.push('<span class="badge b-zero" title="' + esc(t("zeroRetentionTitle")) + '">' + esc(t("zeroRetention")) + "</span>");
  } else if (r.notZdr || r.retain) {
    const ret = retainLabel(r);
    parts.push('<span class="badge b-keep" title="' + esc(t("retentionTitle", { ret: ret })) + '">' + esc(ret) + "</span>");
  }
  return parts.length ? parts.join(" ") : '<span class="muted">—</span>';
}

function copyModelId(r) {
  const text = r.modelId;
  if (!text) return;
  const done = () => toast(t("copied", { id: text }));
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  } catch (e) {
    toast(t("copyFailed"));
  }
}

function rowHtml(r, i) {
  const c = colorOf(r.series);
  const isLiveTier = r.series === "DeepSeek" && r.tier && state.peak !== undefined

  const allowCell = '<span class="allow">' +
    (r.promoOld != null ? '<span class="allow-old" title="' + esc(t("promoOldTitle")) + '">$' + r.promoOld + "</span>" : "") +
    "<span>" + (r.allowance == null ? "—" : (r.allowance >= 9999 ? "不限" : "$" + r.allowance)) + "</span>" + allowBar + "</span>" +
    (r.promoNote ? '<br><span class="badge b-promo" title="' + esc(t("promoBadgeTitle", { note: promoNoteLabel(r.promoNote) })) + '">⚡' + esc(promoNoteLabel(r.promoNote)) + "</span>" : "");
  return '<tr style="--c:' + c + '"' + (r.training ? ' class="is-train"' : "") + ">" +
    '<td class="rank">' + (i + 1) + "</td>" +
    '<td><span class="chip-sm" style="--c:' + c + '">' + esc(seriesLabel(r.series)) + "</span></td>" +
    '<td class="name"><span class="name-inner" title="' + esc(r.name) + '">' + esc(r.name) + "</span>" + (r.training ? " ⚠" : "") + "</td>" +
    '<td class="mid col-mid">' + (r.modelId
      ? '<span class="mid-inner" title="' + esc(r.modelId) + '">' + esc(r.modelId) + '</span><button class="copy-id" data-copy="' + esc(r.modelId) + '" title="' + esc(t("copyIdTitle", { id: r.modelId })) + '"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>'
      : '<span class="muted">—</span>') + "</td>" +
    "<td>" + tier + "</td>" +
    '<td class="num strong">' + fmtPrice(r.input, r.allowance) + "</td>" +
    '<td class="num">' + fmtPrice(r.output, r.allowance) + "</td>" +
    '<td class="num col-cr">' + fmtPrice(r.cacheRead, r.allowance) + "</td>" +
    '<td class="num col-cw">' + fmtPrice(r.cacheWrite, r.allowance) + "</td>" +
    '<td class="num"><span class="allow-wrap">' + allowCell + "</span></td>" +
    "<td>" + privacyCell(r) + "</td>" +
    "</tr>";
}

  document.querySelectorAll("#thead th[data-key]").forEach(th => {
    if (th.dataset.key === state.sortKey) {
      th.setAttribute("aria-sort", state.sortDir === 1 ? "ascending" : "descending");
    } else {
      th.removeAttribute("aria-sort");
    }
  });
}

/* ---------- USD → CNY 汇率 ---------- */
function loadRateCache() {
  try {
    const raw = localStorage.getItem(LS_RATE);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || typeof d.value !== "number" || !(d.value > 0)) return null;
    return d;
  } catch (e) { return null; }
}
function saveRateCache(rec) {
  try { localStorage.setItem(LS_RATE, JSON.stringify(rec)); } catch (e) { /* ignore */ }
}
async function fetchRate() {
  const cached = loadRateCache();
  if (cached) {
    state.rate = cached;
    renderStats();
    renderTable();
    renderRateNote();
  }
  if (cached && Date.now() - (cached.fetchedAt || 0) < 24 * 3600 * 1000) return;
  const apis = [
    { url: "https://api.frankfurter.app/latest?from=USD&to=CNY", src: "frankfurter.app" },
    { url: "https://open.er-api.com/v6/latest/USD", src: "open.er-api.com" }
  ];
  for (const api of apis) {
    try {
      const text = await fetchText(api.url, 8000);
      const j = JSON.parse(text);
      const v = j && j.rates && j.rates.CNY;
      if (typeof v === "number" && v > 0) {
        const rec = {
          value: v,
          date: (j.date && String(j.date)) || new Date().toISOString().slice(0, 10),
          fetchedAt: Date.now(),
          source: api.src
        };
        saveRateCache(rec);
        state.rate = rec;
        renderStats();
        renderTable();
        renderRateNote();
        return;
      }
    } catch (e) { /* try next api */ }
  }
}

function renderRateNote() {
  const r = state.rate || RATE_SNAPSHOT;
  const vars = {
    rate: Number(r.value.toFixed(4)),
    src: r.source,

    live: t(r.fetchedAt ? "rateLive" : "rateSnapshot")
  };
  const el = $("#rate-note");
  if (el) el.textContent = t("rateNote", vars);
  const cny = state.currency === "cny";
  const fx = $("#fx-note");
  if (fx) {
    fx.hidden = !cny;
    if (cny) fx.textContent = t("fxNote", vars);
  }
  const pill = $("#fx-rate");
  if (pill) {
    pill.hidden = !cny;
    if (cny) {
      pill.textContent = t("fxRate", vars);
      pill.title = t("fxRateTitle", vars);
    }
  }
}

function saveCache(rows, notes, when) {
  try {
    localStorage.setItem(LS_CACHE, JSON.stringify({ v: 4, fetchedAt: when, rows, notes }));
  } catch (e) { /* storage unavailable */ }
}

function loadCache() {
  try {
    const raw = localStorage.getItem(LS_CACHE);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || data.v !== 4 || !Array.isArray(data.rows)) return null;
    return { fetchedAt: data.fetchedAt, rows: data.rows, notes: data.notes || null };
  } catch (e) { return null; }
}

function applyData(rows, notes, key, when, save, online) {
  state.rows = rows;
  if (notes && notes.length) state.privacyNotes = notes;
  if (save) saveCache(rows, state.lang === "zh" ? state.privacyNotes : null, when);
  setStatus(key, when, online);
  render();
  setBanner(false);
}

function pickNotes(fetched) {
  if (state.lang === "en") return PRIVACY_NOTES_SNAPSHOT_EN;
  return (fetched && fetched.length) ? fetched : PRIVACY_NOTES_SNAPSHOT;
}

function fetchText(url, ms) {
  return new Promise((resolve, reject) => {
    const ctl = new AbortController();
    const timer = setTimeout(() => {
      ctl.abort();
      reject(new Error("timeout"));
    }, ms || 9000);
    fetch(url, { signal: ctl.signal, cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(t => {
        clearTimeout(timer);
        resolve(t);
      })
      .catch(e => {
        clearTimeout(timer);
        reject(e);
      });
  });
}

async function fetchLive(silent) {
  setRefreshing(true);
  let result = null;
  for (const src of SOURCES) {
    try {
      const text = await fetchText(src.url);
      const rows = src.type === "mdx" ? parseMdPricingTable(text) : parseHtmlPricingTable(text);
      if (!validateRows(rows)) continue;
      let priv = src.type === "mdx" ? parsePrivacySection(text) : parseHtmlPrivacySection(text);
      mergePrivacy(rows, priv);
      let ids = src.type === "mdx" ? parseModelIdTable(text) : parseHtmlModelIdTable(text);
      mergeModelIds(rows, ids);
      result = { rows, notes: priv && priv.notes ? priv.notes : null, key: src.key };
      break;
    } catch (e) { /* try next source */ }
  }
  setRefreshing(false);
  const stamp = new Date().toISOString();
  if (!result) {
    setStatus(state.sourceKey, state.fetchedAt || SNAPSHOT.date, false);
    setBanner(true, t("bannerOffline", { src: statusLabel(state.sourceKey) }));
    if (!silent) toast(t("toastFailed"));
    return;
  }
  result.notes = pickNotes(result.notes);
  if (dataKey(result.rows) === dataKey(state.rows)) {
    if (!state.rows.length || state.rows[0].modelId === undefined) mergeModelIds(state.rows, MODEL_ID_SNAPSHOT);
    saveCache(state.rows, state.lang === "zh" ? result.notes : null, stamp);
    state.privacyNotes = result.notes;
    setStatus(result.key, stamp, true);
    renderPrivacyNotes();
    setBanner(false);
    if (!silent) toast(t("toastFresh"));
  } else {
    applyData(result.rows, result.notes, result.key, stamp, true, true);
    if (!silent) toast(t("toastUpdated"));
  }
}

const usageBtn = $("#usage-btn");

    $("#zen-btn").title = t("btnZenTitle");
    $("#zen-label").textContent = t("btnZen");
    // GitHub 求 Star 按钮：跟随中英文切换按钮文字和悬停提示
    $("#github-btn").title = t("btnGithubTitle");
    $("#github-label").textContent = t("btnGithub");
  $("#refresh-label").textContent = t("btnRefresh");
  $("#theme").title = t("btnThemeTitle");
  $("#status").title = t("statusTitle");
  if (!state.fetchedAt) $("#status-text").textContent = t("statusLoading");
  $("#st-count-l").textContent = t("stCount");
  $("#st-series-l").textContent = t("stSeries");
  $("#search").setAttribute("placeholder", t("searchPh"));
  $("#privacy-legend").title = t("privacyLegendTitle");
  $("#price-mode").title = t("priceModeTitle");
  $("#currency-mode").title = t("currencyTitle");
  const ratioBtn = document.querySelector('#price-mode button[data-m="ratio"]');
  if (ratioBtn) ratioBtn.textContent = t("ratioBtn");
  $("#th-id").textContent = t("thId");
  $("#th-tier").textContent = t("thTier");
  const sortable = { series: "thSeries", name: "thName", allowance: "thAllow", privacy: "thPrivacy" };
  document.querySelectorAll("#thead th[data-key]").forEach(th => {
    const k = th.dataset.key;
    if (!sortable[k]) return;
    const btn = th.querySelector(".th-btn");
    if (btn) btn.innerHTML = esc(t(sortable[k])) + '<span class="ic"></span>';
  });
  $("#foot-price").textContent = t("footPrice");
  $("#foot-peak").textContent = t("footPeak");
  $("#src-label").textContent = t("srcLabel");
  const docLink = $("#doc-link");
  docLink.textContent = t("docLink");
  docLink.href = docUrl();
  $("#snap-label").textContent = t("snapLabel");
  $("#console-pre").textContent = t("consolePre");
  $("#console-link").textContent = t("consoleLink");
  $("#console-post").textContent = t("consolePost");
  syncThemeUi();
  syncPriceModeUi();
  updatePeakStatus();
}

function setLang(lang) {
  if (lang !== "zh" && lang !== "en") return;
  state.lang = lang;
  try { localStorage.setItem(LS_LANG, lang); } catch (e) { /* ignore */ }
  try {
    const u = new URL(location.href);
    if (lang === "zh") u.searchParams.delete("lang");
    else u.searchParams.set("lang", lang);
    history.replaceState(null, "", u.toString());
  } catch (e) { /* ignore */ }
  state.privacyNotes = pickNotes(null);
  applyLangUi();
  render();
  refreshStatusUi();
  fetchLive(true);
}

function bindEvents() {
  $("#lang").addEventListener("click", () => {
    setLang(state.lang === "zh" ? "en" : "zh");
  });
  $("#search").addEventListener("input", e => {
    state.query = e.target.value.trim().toLowerCase();
    renderTable();
  });
  $("#thead").addEventListener("click", e => {
    const btn = e.target.closest("button[data-key]");
    if (!btn) return;
    const k = btn.dataset.key;
    if (state.sortKey === k) state.sortDir *= -1;
    else {
      state.sortKey = k;
      state.sortDir = 1;
    }
    renderTable();
  });
  $("#tbody").addEventListener("click", e => {
    const btn = e.target.closest(".copy-id[data-copy]");
    if (!btn) return;
    copyModelId({ modelId: btn.dataset.copy });
  });
  $("#legend").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const s = chip.dataset.s;
    if (s === "*") state.off.clear();
    else if (state.off.has(s)) state.off.delete(s);
    else state.off.add(s);
    renderLegend();
    renderTable();
  });
  $("#refresh").addEventListener("click", fetchLive);
  $("#theme").addEventListener("click", toggleTheme);
  $("#price-mode").addEventListener("click", e => {
    const btn = e.target.closest("button[data-m]");
    if (!btn) return;
    setRatioMode(btn.dataset.m === "ratio");
  });
  $("#currency-mode").addEventListener("click", e => {
    const btn = e.target.closest("button[data-cur]");
    if (!btn) return;
    setCurrency(btn.dataset.cur);
  });
  $("#privacy-legend").addEventListener("click", e => {
    const chip = e.target.closest(".chip[data-p]");
    if (!chip) return;
    state.privacyFilter = chip.dataset.p;
    renderPrivacyLegend();
    renderTable();
  });
}

(function boot() {
  try {
    const savedTheme = localStorage.getItem(LS_THEME);
    if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    const bootLang = document.documentElement.getAttribute("data-lang");
    if (bootLang === "en" || bootLang === "zh") state.lang = bootLang;
    // 2026-10-07 起默认「月费折算 + 按输出列升序」：sortKey 是 output、sortDir=1，
    // 而 cmp() 走 effVal()，所以默认呈现的就是「输出折算价从小到大」。
    // 用户手动切过的（价格模式 / 排序列 / 升降序）仍然以用户选择为准。
    const savedRatio = localStorage.getItem(LS_RATIO);
    state.ratioMode = savedRatio === null ? true : savedRatio === "1";
    state.currency = localStorage.getItem(LS_CUR) === "cny" ? "cny" : "usd";
    const rc = loadRateCache();
    if (rc) state.rate = rc;
    const sd = $("#snapshot-date");
    if (sd) sd.textContent = SNAPSHOT.date;
  } catch (e) { /* ignore */ }
  applyLangUi();
  bindEvents();
  const cached = loadCache();
  if (cached && validateRows(cached.rows)) {
    const r0 = cached.rows[0];
    if (r0 && (r0.retain === undefined || r0.retainDays === undefined)) {
      mergePrivacy(cached.rows, { table: PRIVACY_SNAPSHOT_TABLE.map(r => ({ model: r[0], train: r[1], retain: r[2] })) });
    }
    if (r0 && r0.modelId === undefined) {
      mergeModelIds(cached.rows, MODEL_ID_SNAPSHOT);
    }
    state.privacyNotes = pickNotes(cached.notes);
    applyData(cached.rows, state.privacyNotes, "cache", cached.fetchedAt || "", false, false);
  } else {
    state.privacyNotes = pickNotes(null);
    applyData(SNAPSHOT.rows, state.privacyNotes, "snapshot", SNAPSHOT.date, false, false);
  }
  setInterval(updatePeakStatus, 30000);
  fetchRate();
  fetchLive();
})();
</script>
</body>
</html>
